# ==============================================================================
# GitHub Actions - Auto-Patcher & Builder EVOX pour PS5
# Déposez ce fichier dans votre dépôt : .github/workflows/build-evox.yml
# Aucun besoin de forker manuellement : il clone, patche à la volée et compile !
# ==============================================================================

name: Build EVOX PS5 Payload (.elf)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version du binaire'
        required: false
        default: '0.0.1'
      http_port:
        description: 'Port HTTP du serveur PS5'
        required: false
        default: '8085'

jobs:
  build-and-package:
    name: 🚀 Build evox.elf & evox_v0.0.1.elf
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Cloner le dépôt original itsPLK/ps5-payload-manager
        run: |
          echo "Clonage de https://github.com/itsPLK/ps5-payload-manager..."
          git clone --depth 1 https://github.com/itsPLK/ps5-payload-manager.git workspace
          cd workspace

      - name: ⚙️ Configuration de Node.js pour le Frontend
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: workspace/frontend/package-lock.json

      - name: 🎨 Patch à la volée : Configuration C & Paramètres Système
        run: |
          cd workspace
          VERSION_INPUT="${{ github.event.inputs.version || '0.0.1' }}"
          PORT_INPUT="${{ github.event.inputs.http_port || '8085' }}"

          echo "Application du patch dans include/config.h..."
          cat << 'EOF' > include/config.h
          /* Auto-generated by EVOX Auto-Patcher */
          #ifndef _CONFIG_H_
          #define _CONFIG_H_

          #define APP_NAME "evoX-CoreOS Payload Manager"
          #define APP_SUBTITLE "Gestionnaire de Payloads & Autoloader EVOX pour PlayStation 5"
          #define APP_VERSION "0.0.1"
          #define APP_AUTHOR "nexgen999"
          #define FORK_URL "https://github.com/MonPseudo/ps5-payload-manager"

          #define ELF_NAME "evox.elf"
          #define ELF_VERSIONED_NAME "evox_v0.0.1.elf"

          #define DEFAULT_HTTP_PORT 8085
          #define DEFAULT_REPO_URL "https://nexgen999.github.io/evoX-CoreOS/json/payloads.json"

          #define PAYLOADS_DIR "/data/evox/payloads"
          #define AUTOLOAD_FILE "/data/evox/autoload/autoload.txt"
          #define USB_MOUNT_PATH "/mnt/usb0"

          #define AUTO_CLOSE_DISC_DEFAULT 1
          #define SCAN_USB_ON_STARTUP 1

          #endif
          EOF

      - name: 🎨 Patch à la volée : Frontend Web & Thème (custom)
        run: |
          cd workspace/frontend

          echo "Patch de src/config.ts avec l'identité EVOX..."
          cat << 'EOF' > src/config.ts
          export const CONFIG = {
            name: "evoX-CoreOS Payload Manager",
            subtitle: "Gestionnaire de Payloads & Autoloader EVOX pour PlayStation 5",
            version: "0.0.1",
            author: "nexgen999",
            defaultPort: 8085,
            mainRepoUrl: "https://nexgen999.github.io/evoX-CoreOS/json/payloads.json",
            mirrorRepoUrls: [],
            theme: {
              accentColor: "#10B981",
              accentSecondary: "#38BDF8",
              bgCanvas: "#0B0F19",
              bgCard: "#131A29",
              borderCard: "#1E293B",
              cardRadius: "xl",
              glowEffect: true
            }
          };
          EOF

          echo "Injection du thème CSS personnalisé..."
          cat << 'EOF' >> src/index.css

          /* EVOX Custom Theme Injected */
          :root {
            --accent-primary: #10B981;
            --accent-secondary: #38BDF8;
            --bg-canvas: #0B0F19;
            --bg-card: #131A29;
            --border-card: #1E293B;
          }
          EOF

      - name: 📦 Compilation du Frontend Web
        run: |
          cd workspace/frontend
          npm install
          npm run build
          cd ../..

      - name: 🔨 Compilation du Démon PS5 ELF avec Docker & PS5 SDK
        run: |
          cd workspace
          echo "Démarrage de la compilation du binaire ELF PS5..."
          
          # Vérifier si un script de build release existe déjà
          if [ -f "build_release.sh" ]; then
            chmod +x build_release.sh
            ./build_release.sh || true
          fi

          # Compilation native via l'image Docker du SDK PS5
          docker run --rm -v "$(pwd):/project" -w /project ghcr.io/itsplk/ps5-payload-sdk:latest make ||           docker run --rm -v "$(pwd):/project" -w /project ps5-toolchain:latest make ||           make || true

          # Recherche du binaire produit (pldmgr.elf ou *.elf)
          PRODUCED_ELF=$(find . -maxdepth 2 -name "*.elf" | head -n 1)

          if [ -z "$PRODUCED_ELF" ]; then
            echo "Aucun .elf trouvé directement, tentative de compilation de secours..."
            clang -O2 -Wall -fPIE -mcmodel=small -target x86_64-pc-freebsd12 -DPS5 -o "evox.elf" src/*.c -Iinclude || true
            PRODUCED_ELF="evox.elf"
          fi

          echo "Binaire source identifié : $PRODUCED_ELF"
          
          # Renommage et copie en evox.elf et evox_vXXX.elf
          cp "$PRODUCED_ELF" "../evox.elf"
          cp "$PRODUCED_ELF" "../evox_v0.0.1.elf"
          cd ..

          echo "=== Vérification des Binaires Créés ==="
          ls -lh evox.elf evox_v0.0.1.elf

      - name: 💾 Sauvegarder les Fichiers ELF en Téléchargement (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: EVOX-PS5-Payloads
          path: |
            evox.elf
            evox_v0.0.1.elf
          retention-days: 30

      - name: 🚀 Créer une Release GitHub Automatique
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version || '0.0.1' }}
          name: EVOX PS5 Payload v${{ github.event.inputs.version || '0.0.1' }}
          body: |
            ## EVOX Payload Manager pour PlayStation 5
            - **Binaire principal** : `evox.elf`
            - **Binaire versionné** : `evox_v0.0.1.elf`
            - **Port d'écoute** : `8085`
            - **Dépôt officiel** : `https://nexgen999.github.io/evoX-CoreOS/json/payloads.json`
          files: |
            evox.elf
            evox_v0.0.1.elf
