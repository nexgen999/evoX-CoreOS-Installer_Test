- name: Importation sélective - evoX-CoreOS
        run: |
          MANIFEST="$GITHUB_WORKSPACE/install-manifest.json"
          if [ ! -f "$MANIFEST" ]; then
            echo "Erreur : install-manifest.json introuvable à la racine !"
            exit 1
          fi

          REPO=$(jq -r '."evoX-CoreOS".repository' "$MANIFEST")
          BRANCH=$(jq -r '."evoX-CoreOS".branch' "$MANIFEST")

          echo "Clonage depuis : https://github.com/${REPO}.git (branche: ${BRANCH})"
          
          git clone --depth 1 --filter=blob:none --sparse "https://github.com/${REPO}.git" temp_core
          cd temp_core
          git checkout "$BRANCH"
          
          jq -r '."evoX-CoreOS".items[]' "$MANIFEST" | while read -r item; do
            git sparse-checkout add "$item"
          done
          
          jq -r '."evoX-CoreOS".items[]' "$MANIFEST" | while read -r item; do
            mkdir -p "../$(dirname "$item")"
            cp -r "$item" "../$item"
          done
          cd ..
          rm -rf temp_core

