name: evoX Auto Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  actions: write

jobs:
  install-and-clean:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt cible
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configuration de Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Installation de jq
        run: sudo apt-get install -y jq

      - name: Importation sélective - evoX-CoreOS
        run: |
          MANIFEST="$GITHUB_WORKSPACE/install-manifest.json"
          if [ ! -f "$MANIFEST" ]; then
            echo "Erreur : install-manifest.json introuvable !"
            exit 1
          fi

          REPO=$(jq -r '."evoX-CoreOS".repository' "$MANIFEST")
          BRANCH=$(jq -r '."evoX-CoreOS".branch' "$MANIFEST")

          echo "Clonage depuis : https://github.com/${REPO}.git (branche: ${BRANCH})"
          
          git clone --depth 1 --filter=blob:none --sparse "https://github.com/${REPO}.git" temp_core
          cd temp_core
          git checkout "$BRANCH"
          
          git sparse-checkout set --no-cone
          
          jq -r '."evoX-CoreOS".items[]' "$MANIFEST" | while read -r item; do
            git sparse-checkout add "$item"
          done
          
          jq -r '."evoX-CoreOS".items[]' "$MANIFEST" | while read -r item; do
            if [ -e "$item" ]; then
              mkdir -p "../$(dirname "$item")"
              cp -r "$item" "../$item"
            fi
          done
          cd ..
          rm -rf temp_core

      - name: Importation sélective - evoX-CoreOS-WebUI
        run: |
          MANIFEST="$GITHUB_WORKSPACE/install-manifest.json"
          
          REPO=$(jq -r '."evoX-CoreOS-WebUI".repository' "$MANIFEST")
          BRANCH=$(jq -r '."evoX-CoreOS-WebUI".branch' "$MANIFEST")

          echo "Clonage depuis : https://github.com/${REPO}.git (branche: ${BRANCH})"
          
          git clone --depth 1 --filter=blob:none --sparse "https://github.com/${REPO}.git" temp_webui
          cd temp_webui
          git checkout "$BRANCH"
          
          git sparse-checkout set --no-cone
          
          jq -r '."evoX-CoreOS-WebUI".items[]' "$MANIFEST" | while read -r item; do
            git sparse-checkout add "$item"
          done
          
          jq -r '."evoX-CoreOS-WebUI".items[]' "$MANIFEST" | while read -r item; do
            if [ -e "$item" ]; then
              mkdir -p "../$(dirname "$item")"
              cp -r "$item" "../$item"
            fi
          done
          cd ..
          rm -rf temp_webui

      - name: Création des dossiers requis
        run: |
          mkdir -p assets/icon feed/apps feed/ffpfsc feed/payloads feed/pkg
          echo "Placez vos icônes ici." > assets/icon/readme.txt
          echo "Placez vos .opml apps ici." > feed/apps/readme.txt
          echo "Placez vos .opml ffpfsc ici." > feed/ffpfsc/readme.txt
          echo "Placez vos .opml payloads ici." > feed/payloads/readme.txt
          echo "Placez vos .opml pkg ici." > feed/pkg/readme.txt

      - name: Adaptation dynamique de config.json
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          PAGES_URL="https://${OWNER}.github.io/${REPO_NAME}"
          RAW_URL="https://raw.githubusercontent.com/${OWNER}/${REPO_NAME}/main"

          if [ -f "web/data/config.json" ]; then
            tmp=$(mktemp)
            jq --arg owner "$OWNER" --arg repo "$REPO_NAME" --arg pages "$PAGES_URL" --arg raw "$RAW_URL" '.github.user = $owner | .github.dataRepository = ($owner + "/" + $repo) | .github.webuiRepository = ($owner + "/" + $repo) | .sources.pldmgr = ($pages + "/json/payloads.json") | .sources.json[0].url = ($pages + "/json/payloads.json") | .sources.json[1].url = ($pages + "/json/pkg.json") | .sources.json[2].url = ($pages + "/json/ffpfsc.json") | .sources.json[3].url = ($pages + "/json/apps.json") | .sources.changelog = ($raw + "/CHANGELOG.md") | .releases.baseUrl = ("https://github.com/" + $owner + "/" + $repo + "/releases/download/latest/") | .socials[0].url = ("https://github.com/" + $owner)' web/data/config.json > "$tmp" && mv "$tmp" web/data/config.json
          fi

      - name: Génération de README.md
        run: |
          cat << 'EOF' > README.md
          # evoX CoreOS & WebUI - Installation réussie

          Votre environnement evoX est installé et pré-configuré.

          ## Guide de démarrage rapide :
          1. Ajouter vos flux OPML dans `feed/`.
          2. Activer GitHub Pages dans Settings > Pages sur la branche main.
          3. Mettre à jour la boutique via l'action update.yml.
          EOF

          cp README.md post_install_instruction.md

      - name: Nettoyage de l'installateur
        run: |
          rm -f install-manifest.json
          rm -rf .github/workflows/auto-installer.yml

      - name: Commit et Push des fichiers
        run: |
          git add -A
          git commit -m "feat: installation automatique evoX"
          git push origin HEAD:${{ github.ref_name }}
