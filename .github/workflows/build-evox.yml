name: "Build EVOX PS5 Payload"

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version:
        description: "Version du binaire (ex: 1.6.0)"
        required: false
        default: "6.6.6"

permissions:
  contents: write

jobs:
  build:
    name: "Compilation EVOX ELF"
    runs-on: ubuntu-latest

    steps:
      - name: "Clonage du depot itsPLK/ps5-payload-manager"
        run: |
          echo "Clonage du code source original..."
          git clone --depth 1 https://github.com/itsPLK/ps5-payload-manager.git workspace

      - name: "Configuration de Node.js pour le Frontend"
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: "Personnalisation Visuelle & Depots (Non-Destructif)"
        run: |
          cd workspace

          echo "1. Personnalisation du nom de l'application dans le Frontend..."
          find frontend -type f \( -name "*.html" -o -name "*.vue" -o -name "*.tsx" -o -name "*.ts" -o -name "*.js" -o -name "*.json" \) -exec sed -i "s|PS5 Payload Manager|evoX-CoreOS Payload Manager|g" {} +

          echo "2. Remplacement du depot principal dans src/sources.c..."
          if [ -f "src/sources.c" ]; then
            sed -i 's|https://itsplk.github.io/ps5-payloads-mirror/payloads.json|https://nexgen999.github.io/evoX-CoreOS/json/payloads.json|g' src/sources.c
          fi

          echo "3. Personnalisation du port HTTP (8085)..."
          if [ -f "src/http_server.c" ]; then
            sed -i 's|8084|8085|g' src/http_server.c
          fi

          echo "Configuration appliquee avec succes sans toucher aux structures C."

      - name: "Compilation Native PS5 via Docker SDK"
        run: |
          cd workspace
          chmod +x build_release.sh

          echo "Execution du script officiel build_release.sh..."
          ./build_release.sh

          echo "Verification du binaire produit pldmgr.elf..."
          if [ -f "pldmgr.elf" ]; then
            echo "pldmgr.elf genere avec succes !"
            cp pldmgr.elf "../evox.elf"
            cp pldmgr.elf "../evox_v6.6.6.elf"
            cd ..
            ls -lh "evox.elf" "evox_v6.6.6.elf"
          else
            echo "ERREUR: pldmgr.elf non trouve."
            exit 1
          fi

      - name: "Sauvegarde des Binaires ELF (Artifacts)"
        uses: actions/upload-artifact@v4
        with:
          name: "EVOX-PS5-Payloads"
          path: |
            evox.elf
            evox_v6.6.6.elf
          retention-days: 30
