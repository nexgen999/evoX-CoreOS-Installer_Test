name: "Build EVOX PS5 Payload"

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version:
        description: "Version du binaire"
        required: false
        default: "0.0.1"

permissions:
  contents: write

jobs:
  build:
    name: "Compilation EVOX ELF"
    runs-on: ubuntu-latest

    steps:
      - name: "Clonage du depot itsPLK/ps5-payload-manager"
        run: |
          echo "Clonage du depot source..."
          git clone --depth 1 https://github.com/itsPLK/ps5-payload-manager.git workspace

      - name: "Configuration de Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: "Application des patchs et configuration EVOX"
        run: |
          cd workspace
          node -e '
          const fs = require("fs");

          // 1. Generation propre de include/config.h
          const configContent = `/* Auto-generated EVOX Config */
          #ifndef _CONFIG_H_
          #define _CONFIG_H_

          #define APP_NAME "evoX-CoreOS Payload Manager"
          #define APP_SUBTITLE "Gestionnaire de Payloads & Autoloader EVOX pour PlayStation 5"
          #define APP_VERSION "0.0.1"
          #define APP_AUTHOR "nexgen999"
          #define FORK_URL "https://github.com/MonPseudo/ps5-payload-manager"

          #define ELF_NAME "evox.elf"
          #define ELF_VERSIONED_NAME "evox_v0.0.1.elf"

          #define DEFAULT_HTTP_PORT 8085
          #define DEFAULT_REPO_URL "https://nexgen999.github.io/evoX-CoreOS/json/payloads.json"

          #define PAYLOADS_DIR "/data/evox/payloads"
          #define AUTOLOAD_FILE "/data/evox/autoload/autoload.txt"
          #define USB_MOUNT_PATH "/mnt/usb0"

          #define AUTO_CLOSE_DISC_DEFAULT 1
          #define SCAN_USB_ON_STARTUP 1

          #endif
          `;
          fs.writeFileSync("include/config.h", configContent);

          // 2. Generation propre de frontend/src/config.ts
          const frontendConfig = `export const CONFIG = {
            name: "evoX-CoreOS Payload Manager",
            subtitle: "Gestionnaire de Payloads & Autoloader EVOX pour PlayStation 5",
            version: "0.0.1",
            author: "nexgen999",
            elfName: "evox.elf",
            versionedElfName: "evox_v0.0.1.elf",
            defaultPort: 8085,
            mainRepoUrl: "https://nexgen999.github.io/evoX-CoreOS/json/payloads.json",
            mirrorRepoUrls: [],
            theme: {
              accentColor: "#10B981",
              accentSecondary: "#00439C",
              bgCanvas: "#040711",
              bgCard: "#0A1224",
              borderCard: "#164E63",
              cardRadius: "xl",
              glowEffect: true
            }
          };
          `;
          fs.writeFileSync("frontend/src/config.ts", frontendConfig);
          '

      - name: "Compilation du Frontend Web"
        run: |
          cd workspace/frontend
          npm install
          npm run build

      - name: "Compilation du Binaire PS5 ELF"
        run: |
          cd workspace

          # Executer build_release.sh si present
          if [ -f "build_release.sh" ]; then
            chmod +x build_release.sh
            ./build_release.sh || true
          fi

          # Construction de l image SDK Docker si Dockerfile.sdk est present
          if [ -f "Dockerfile.sdk" ]; then
            echo "Construction du conteneur SDK..."
            docker build -f Dockerfile.sdk -t ps5-payload-sdk-pldmgr .
            docker run --rm -v "$(pwd):/workspace" -w /workspace ps5-payload-sdk-pldmgr make || true
          fi

          # Verification des binaires .elf produits
          PRODUCED=$(find . -maxdepth 2 -name "*.elf" | head -n 1)

          if [ -z "$PRODUCED" ]; then
            echo "Tentative make natif..."
            make || true
            PRODUCED=$(find . -maxdepth 2 -name "*.elf" | head -n 1)
          fi

          if [ -n "$PRODUCED" ]; then
            echo "Binaire produit avec succes : $PRODUCED"
            cp "$PRODUCED" "../evox.elf"
            cp "$PRODUCED" "../evox_v0.0.1.elf"
            cd ..
            ls -lh "evox.elf" "evox_v0.0.1.elf"
          else
            echo "ERREUR: Impossible de produire le fichier .elf"
            exit 1
          fi

      - name: "Sauvegarde des Binaires ELF (Artifacts)"
        uses: actions/upload-artifact@v4
        with:
          name: "EVOX-PS5-Payloads"
          path: |
            evox.elf
            evox_v0.0.1.elf
          retention-days: 30
