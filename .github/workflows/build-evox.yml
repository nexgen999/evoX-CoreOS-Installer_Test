name: "Build EVOX PS5 Payload"

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version:
        description: "Version du binaire"
        required: false
        default: "6.6.6"

permissions:
  contents: write

jobs:
  build:
    name: "Compilation EVOX ELF"
    runs-on: ubuntu-latest

    steps:
      - name: "Clonage du depot itsPLK/ps5-payload-manager"
        run: |
          echo "Clonage du code source original..."
          git clone --depth 1 https://github.com/itsPLK/ps5-payload-manager.git workspace

      - name: "Configuration de Node.js pour le Frontend"
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: "Personnalisation Profonde & Reconstruction Frontend"
        run: |
          cd workspace

          echo "1. Remplacement global du nom dans tous les fichiers..."
          grep -rl "PS5 Payload Manager" . | xargs -r sed -i "s|PS5 Payload Manager|evoX-CoreOS Payload Manager|g"

          echo "2. Remplacement du depot principal de payloads..."
          grep -rl "https://itsplk.github.io/ps5-payloads-mirror/payloads.json" . | xargs -r sed -i "s|https://itsplk.github.io/ps5-payloads-mirror/payloads.json|https://nexgen999.github.io/evoX-CoreOS/json/payloads.json|g"
          grep -rl "itsplk.github.io" . | xargs -r sed -i "s|https://itsplk.github.io/ps5-payloads-mirror/payloads.json|https://nexgen999.github.io/evoX-CoreOS/json/payloads.json|g"

          echo "3. Remplacement du port HTTP (8085)..."
          grep -rl "8084" src/ include/ frontend/ | xargs -r sed -i "s|8084|8085|g"

          echo "4. Reconstruction du Frontend Web pour integrer evoX-CoreOS..."
          cd frontend
          npm install
          npm run build
          cd ..

          echo "5. Re-generation des assets C integres au binaire..."
          if [ -d "frontend/dist" ]; then
            find frontend/dist -type f -exec sed -i "s|PS5 Payload Manager|evoX-CoreOS Payload Manager|g" {} +
            find frontend/dist -type f -exec sed -i "s|8084|8085|g" {} +
          fi

          if [ -f "tools/gen_assets.py" ]; then
            python3 tools/gen_assets.py || true
          fi

          echo "Frontend reconstruit et assets C mis a jour avec succes !"

      - name: "Compilation Native PS5 via Docker SDK"
        run: |
          cd workspace
          chmod +x build_release.sh

          echo "Execution du script officiel build_release.sh..."
          ./build_release.sh

          echo "Verification et recuperation des binaires .elf..."
          PRODUCED_ELF=$(find . -maxdepth 3 -name "*.elf" | head -n 1)

          if [ -n "$PRODUCED_ELF" ]; then
            echo "Binaire compile trouve avec succes : $PRODUCED_ELF"
            cp "$PRODUCED_ELF" "../evox.elf"
            cp "$PRODUCED_ELF" "../evox_v6.6.6.elf"
            cd ..
            echo "=== Fichiers EVOX prets pour telechargement ==="
            ls -lh evox.elf evox_v6.6.6.elf
          else
            echo "ERREUR: Aucun fichier .elf n'a ete trouve."
            exit 1
          fi

      - name: "Sauvegarde des Binaires ELF (Artifacts)"
        uses: actions/upload-artifact@v4
        with:
          name: "EVOX-PS5-Payloads"
          path: |
            evox.elf
            evox_v6.6.6.elf
          retention-days: 30
