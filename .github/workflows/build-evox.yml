name: "Build EVOX PS5 Payload"

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version:
        description: "Version du binaire"
        required: false
        default: "6.6.6"
      port:
        description: "Port HTTP du serveur PS5"
        required: false
        default: "8085"

permissions:
  contents: write

jobs:
  build:
    name: "Compilation EVOX ELF"
    runs-on: ubuntu-latest

    # =========================================================================
    # VARIABLES DE PERSONNALISATION VISUELLE & CHEMINS PS5
    # Vous pouvez modifier directement ces valeurs ici :
    # =========================================================================
    env:
      # --- Identité, Titres & Accueil PS5 ---
      APP_NAME: "evoX-CoreOS Payload Manager"
      PARAM_TITLE_NAME: "evoX-CoreOS Payload Manager"
      APP_SUBTITLE: "Gestionnaire de Payloads & Autoloader evoX-CoreOS pour PlayStation 5"
      TITLE_ID: "EVOX00001"
      CUSTOM_ICON_URL: "https://github.com/nexgen999/evox/blob/main/pldmgr_screenshot.png"
      VERSION: "${{ github.event.inputs.version || '6.6.6' }}"
      HTTP_PORT: "${{ github.event.inputs.port || '8085' }}"
      REPO_URL: "https://nexgen999.github.io/evoX-CoreOS/json/payloads.json"
      BUILD_STRING: "evoX-CoreOS v6.6.6 by nexgen999 (custom build)"
      LOGO_BADGE_TEXT: "COREOS"
      DONATE_TEXT: "♡ DONATE"

      # --- Options du Démon C (src/config.c) ---
      CFG_AUTOLOAD_ENABLED: "0"
      CFG_AUTO_BROWSER_OPEN: "1"
      CFG_AUTOLOAD_DELAY: "5"
      CFG_KILL_DISC_PLAYER: "1"
      CFG_SCAN_USB_PAYLOADS: "1"
      CFG_AUTO_INSTALL_APP: "1"
      CFG_MULTI_SOURCES_ENABLED: "1"

      # --- Chemins Système PS5 (include/pldmgr.h & sources C) ---
      PAYLOADS_DIR: "/data/evox/payloads"
      AUTOLOAD_PATH: "/data/evox/config/autoload.txt"
      CONFIG_DIR: "/data/evox"
      USB_MOUNT_PATH: "/mnt/usb0"

      # --- Options Graphiques Granulaires du Frontend ---
      BG_CANVAS: "#0B0F19"
      SIDEBAR_BG: "#000000"
      ACTIVE_PILL_BG: "#ff0000"
      ACTIVE_PILL_TEXT: "#ffffff"
      BADGE_BG: "#ff0000"
      BG_CARD: "#131A29"
      BORDER_CARD: "#1E293B"
      CARD_TITLE_COLOR: "#ffffff"
      CARD_VERSION_COLOR: "#3a96f8"

    steps:
      - name: "Clonage du depot itsPLK/ps5-payload-manager"
        run: |
          echo "Clonage du code source original..."
          git clone --depth 1 https://github.com/itsPLK/ps5-payload-manager.git workspace

      - name: "Configuration de Node.js pour le Frontend"
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # -----------------------------------------------------------------------
      # ÉTAPE 0 : REMPLACEMENT DES ICÔNES DE FRONTEND/PUBLIC/
      # -----------------------------------------------------------------------
      - name: "Remplacement des Icônes Personnalisées (frontend/public)"
        run: |
          cd workspace

          # 1. Si un dossier custom_icons existe dans votre dépôt GitHub :
          if [ -d "../custom_icons" ]; then
            echo "Copie des icônes depuis custom_icons/ vers frontend/public/..."
            cp -rf ../custom_icons/* frontend/public/
          elif [ -d "custom_icons" ]; then
            cp -rf custom_icons/* frontend/public/
          fi

          # 2. Si une URL d'icône est fournie dans les variables :
          if [ -n "$CUSTOM_ICON_URL" ]; then
            echo "Téléchargement de l'icône depuis $CUSTOM_ICON_URL..."
            curl -sSL "$CUSTOM_ICON_URL" -o frontend/public/icon.png
          fi

          echo "Icônes actives dans frontend/public/ :"
          ls -lh frontend/public/

      # -----------------------------------------------------------------------
      # ÉTAPE 1 : PATCH DES SOURCES C, CONFIG.C, PARAM.JSON ET PLDMGR.H
      # -----------------------------------------------------------------------
      - name: "Patch du Noyau C, config.c, assets/param.json & include/pldmgr.h"
        run: |
          cd workspace

          echo "--> 1.1 assets/param.json : Remplacement du titleName et titleId..."
          if [ -d "assets" ]; then
            find assets -name "param.json" -exec sed -i "s|"titleName": *"[^"]*"|"titleName": "$PARAM_TITLE_NAME"|g" {} +
            find assets -name "param.json" -exec sed -i "s|"titleId": *"[^"]*"|"titleId": "$TITLE_ID"|g" {} +
          fi

          echo "--> 1.2 src/app_installer.c ligne 101 : Remplacement de PLDM00001 par $TITLE_ID..."
          if [ -f "src/app_installer.c" ]; then
            sed -i "s|const char **title_id *= *"[^"]*";|const char *title_id = "$TITLE_ID";|g" src/app_installer.c
            sed -i "s|PLDM00001|$TITLE_ID|g" src/app_installer.c
            sed -i "s|Payload Manager|$PARAM_TITLE_NAME|g" src/app_installer.c
          fi
          grep -rl "PLDM00001" . | xargs -r sed -i "s|PLDM00001|$TITLE_ID|g"

          echo "--> 1.3 src/config.c : Configuration des valeurs par défaut cfg->..."
          if [ -f "src/config.c" ]; then
            sed -i "s|cfg->autoload_enabled *= *[0-9]*;|cfg->autoload_enabled      = $CFG_AUTOLOAD_ENABLED;|" src/config.c
            sed -i "s|cfg->auto_browser_open *= *[0-9]*;|cfg->auto_browser_open     = $CFG_AUTO_BROWSER_OPEN;|" src/config.c
            sed -i "s|cfg->autoload_delay *= *[0-9]*;|cfg->autoload_delay        = $CFG_AUTOLOAD_DELAY;|" src/config.c
            sed -i "s|cfg->kill_disc_player *= *[0-9]*;|cfg->kill_disc_player      = $CFG_KILL_DISC_PLAYER;|" src/config.c
            sed -i "s|cfg->scan_usb_payloads *= *[0-9]*;|cfg->scan_usb_payloads     = $CFG_SCAN_USB_PAYLOADS;|" src/config.c
            sed -i "s|cfg->auto_install_app *= *[0-9]*;|cfg->auto_install_app      = $CFG_AUTO_INSTALL_APP;|" src/config.c
            sed -i "s|cfg->multi_sources_enabled *= *[0-9]*;|cfg->multi_sources_enabled = $CFG_MULTI_SOURCES_ENABLED;|" src/config.c
          fi

          echo "--> 1.4 include/pldmgr.h : Remplacement de tous les #define..."
          if [ -f "include/pldmgr.h" ]; then
            sed -i "s|#define MENU_VERSION *"[^"]*"|#define MENU_VERSION "$VERSION"|" include/pldmgr.h
            sed -i "s|#define MENU_PORT *[0-9]*|#define MENU_PORT $HTTP_PORT|" include/pldmgr.h
            sed -i "s|#define BASE_DATA_DIR *"[^"]*"|#define BASE_DATA_DIR "$CONFIG_DIR"|" include/pldmgr.h
            sed -i "s|#define AUTOLOAD_CONFIG_PATH *"[^"]*"|#define AUTOLOAD_CONFIG_PATH "$AUTOLOAD_PATH"|" include/pldmgr.h
            sed -i "s|#define PAYLOADS_STORAGE_DIR *"[^"]*"|#define PAYLOADS_STORAGE_DIR "$PAYLOADS_DIR"|" include/pldmgr.h
            sed -i "s|#define REPOSITORY_SOURCE_URL *"[^"]*"|#define REPOSITORY_SOURCE_URL "$REPO_URL"|" include/pldmgr.h
          fi

          echo "--> 1.5 Chemins généraux (/data/pldmgr, /data/payloads, /mnt/usb0)..."
          find include src -type f -exec sed -i "s|/data/payloads|$PAYLOADS_DIR|g" {} +
          find include src -type f -exec sed -i "s|/data/autoload/autoload.txt|$AUTOLOAD_PATH|g" {} +
          find include src -type f -exec sed -i "s|/data/pldmgr|$CONFIG_DIR|g" {} +
          find include src -type f -exec sed -i "s|/mnt/usb0|$USB_MOUNT_PATH|g" {} +

          echo "--> 1.6 Port HTTP ($HTTP_PORT) et URL du dépôt ($REPO_URL)..."
          if [ -f "src/http_server.c" ]; then
            sed -i "s|8084|$HTTP_PORT|g" src/http_server.c
          fi
          grep -rl "8084" src/ include/ | xargs -r sed -i "s|8084|$HTTP_PORT|g"
          grep -rl "https://itsplk.github.io/ps5-payloads-mirror/payloads.json" . | xargs -r sed -i "s|https://itsplk.github.io/ps5-payloads-mirror/payloads.json|$REPO_URL|g"
          grep -rl "itsplk.github.io" . | xargs -r sed -i "s|https://itsplk.github.io/ps5-payloads-mirror/payloads.json|$REPO_URL|g"

          echo "--> 1.7 Nom global de l'application..."
          grep -rl "PS5 Payload Manager" src/ include/ | xargs -r sed -i "s|PS5 Payload Manager|$APP_NAME|g"

          echo "Patchs C et configuration appliques avec succes !"

      # -----------------------------------------------------------------------
      # ÉTAPE 2 : PERSONNALISATION GRAPHIQUE DU FRONTEND (THÈME & COULEURS)
      # -----------------------------------------------------------------------
      - name: "Injection des Options Graphiques & Thème Visuel"
        run: |
          cd workspace

          echo "--> 2.1 Remplacement du bandeau build, logo badge et textes..."
          find frontend -type f \( -name "*.html" -o -name "*.vue" -o -name "*.tsx" -o -name "*.ts" -o -name "*.js" -o -name "*.json" \) -exec sed -i "s|PS5 Payload Manager|$APP_NAME|g" {} +
          find frontend -type f \( -name "*.html" -o -name "*.vue" -o -name "*.tsx" -o -name "*.ts" -o -name "*.js" -o -name "*.json" \) -exec sed -i "s|PLDMGR|$LOGO_BADGE_TEXT|g" {} +

          cat << EOF > /tmp/evox_theme.css
          <style id="evox-custom-theme">
            :root {
              --primary-color: $ACTIVE_PILL_BG !important;
              --accent-color: $ACTIVE_PILL_BG !important;
              --bg-color: $BG_CANVAS !important;
              --sidebar-bg: $SIDEBAR_BG !important;
              --card-bg: $BG_CARD !important;
              --card-border: $BORDER_CARD !important;
            }
            body {
              background-color: $BG_CANVAS !important;
            }
            aside, nav.sidebar {
              background-color: $SIDEBAR_BG !important;
            }
            /* Bouton actif (DASHBOARD) */
            .bg-blue-600, .bg-sky-500, .bg-sky-600 {
              background-color: $ACTIVE_PILL_BG !important;
              color: $ACTIVE_PILL_TEXT !important;
            }
            /* Titres et versions des cartes */
            .text-sky-400, .text-blue-400 {
              color: $CARD_VERSION_COLOR !important;
            }
          </style>
          EOF

          # Injection juste avant la fermeture </head>
          if [ -f "frontend/index.html" ]; then
            sed -i 's|</head>|'"$(cat /tmp/evox_theme.css)"'</head>|' frontend/index.html || true
            sed -i "s|<title>.*</title>|<title>$APP_NAME</title>|g" frontend/index.html
          fi

      # -----------------------------------------------------------------------
      # ÉTAPE 3 : RECONSTRUCTION DU FRONTEND & MISE À JOUR DES ASSETS C
      # -----------------------------------------------------------------------
      - name: "Reconstruction Frontend & Régénération des Assets C"
        run: |
          cd workspace

          echo "--> 3.1 Compilation du Frontend avec npm run build..."
          cd frontend
          npm install
          npm run build
          cd ..

          echo "--> 3.2 Injection dans frontend/dist pour assurer la prise en compte..."
          if [ -d "frontend/dist" ]; then
            find frontend/dist -type f -exec sed -i "s|PS5 Payload Manager|$APP_NAME|g" {} +
            find frontend/dist -type f -exec sed -i "s|8084|$HTTP_PORT|g" {} +
          fi

          echo "--> 3.3 Régénération des headers C contenant le site web..."
          if [ -f "tools/gen_assets.py" ]; then
            python3 tools/gen_assets.py || true
          fi

          echo "Frontend reconstruit et assets réintégrés avec succès !"

      # -----------------------------------------------------------------------
      # ÉTAPE 4 : COMPILATION DU DÉMON PS5 VIA DOCKER SDK
      # -----------------------------------------------------------------------
      - name: "Compilation Native PS5 via Docker SDK"
        run: |
          cd workspace
          chmod +x build_release.sh

          echo "Exécution de build_release.sh..."
          ./build_release.sh

          echo "Vérification et renommage des binaires..."
          PRODUCED_ELF=$(find . -maxdepth 3 -name "*.elf" | head -n 1)

          if [ -n "$PRODUCED_ELF" ]; then
            echo "Binaire généré trouvé : $PRODUCED_ELF"
            cp "$PRODUCED_ELF" "../evox.elf"
            cp "$PRODUCED_ELF" "../evox_v6.6.6.elf"
            cd ..
            echo "=== Fichiers EVOX prêts ==="
            ls -lh "evox.elf" "evox_v6.6.6.elf"
          else
            echo "ERREUR: Aucun fichier .elf n'a été produit."
            exit 1
          fi

      # -----------------------------------------------------------------------
      # ÉTAPE 5 : TÉLÉCHARGEMENT DIRECT DES ARTIFACTS
      # -----------------------------------------------------------------------
      - name: "Sauvegarde des Binaires ELF (Artifacts)"
        uses: actions/upload-artifact@v4
        with:
          name: "EVOX-PS5-Payloads"
          path: |
            evox.elf
            evox_v6.6.6.elf
          retention-days: 30
