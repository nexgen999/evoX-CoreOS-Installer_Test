<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Portfolio personnel GitHub de nexgen">
  <title>nexgen — Projects & Open Source</title>
  <link rel="icon" href="assets/nexgen-logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link rel="stylesheet" href="web/css/style.css">
</head>
<body>
  <div id="cursorGlow" class="cursor-glow"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img id="sideLogo" src="assets/nexgen-logo.png" alt="nexgen">
      </div>
      <nav class="main-nav">
        <button class="nav-item active" data-view="home"><i class="fa-solid fa-house"></i><span>Accueil</span></button>
        <button class="nav-item" data-view="projects"><i class="fa-solid fa-grid-2"></i><span>Mes projets</span></button>
        <button class="nav-item" data-view="categories"><i class="fa-solid fa-layer-group"></i><span>Catégories</span></button>
        <button class="nav-item" data-view="about"><i class="fa-regular fa-user"></i><span>À propos</span></button>
        <button class="nav-item" data-view="documentation"><i class="fa-regular fa-file-lines"></i><span>Documentation</span></button>
      </nav>
      <div class="sidebar-section">
        <div class="section-label">Catégories</div>
        <div id="categoryNav"></div>
      </div>
      <div class="sidebar-bottom">
        <span>Code</span><span>•</span><span>Play</span><span>•</span><span>Create</span>
      </div>
    </aside>

    <main class="main">
      <header class="hero">
        <div class="hero-image"></div>
        <div class="hero-content">
          <img id="mainLogo" class="main-logo" src="assets/nexgen-logo.png" alt="nexgen">
          <div class="hero-tags" id="heroTags"></div>
        </div>
      </header>

      <section class="profile-strip">
        <div class="profile-main">
          <img id="avatar" class="avatar" src="" alt="Avatar GitHub">
          <div class="profile-copy">
            <div class="profile-name-row"><h1 id="displayName">nexgen</h1><a id="profileGithub" href="#" class="icon-button" aria-label="GitHub"><i class="fa-brands fa-github"></i></a></div>
            <p id="bio"></p>
            <div class="stats" id="stats"></div>
          </div>
        </div>
        <div class="social-block">
          <div class="section-label">Retrouvez-moi sur</div>
          <div class="socials" id="socials"></div>
        </div>
      </section>

      <div class="toolbar">
        <div>
          <div class="eyebrow" id="pageEyebrow">PORTFOLIO</div>
          <h2 id="pageTitle">Mes projets</h2>
        </div>
        <div class="view-controls">
          <button class="view-btn active" data-view-mode="cards" title="Vue cartes"><i class="fa-solid fa-table-cells-large"></i></button>
          <button class="view-btn" data-view-mode="compact" title="Vue compacte"><i class="fa-solid fa-table-cells"></i></button>
          <button class="view-btn" data-view-mode="list" title="Vue liste"><i class="fa-solid fa-list"></i></button>
          <button class="view-btn" data-view-mode="masonry" title="Vue masonry"><i class="fa-solid fa-grip"></i></button>
        </div>
      </div>

      <div id="content"></div>
      <footer id="footer"></footer>
    </main>
  </div>

  <div class="mobile-bar"><button id="mobileMenu"><i class="fa-solid fa-bars"></i></button><span id="mobileTitle">nexgen</span></div>
  <script src="web/js/app.js"></script>
</body>
</html>
