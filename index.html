<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Portfolio GitHub de nexgen">
<title>nexgen — Projects & Open Source</title>
<link rel="icon" href="assets/nexgen-logo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
<link rel="stylesheet" href="web/css/style.css">
</head>
<body>
<div id="cursorGlow" class="cursor-glow"></div>
<div id="toast" class="toast"></div>
<div class="app-shell">
<aside class="sidebar" id="sidebar">
  <div class="brand"><img id="sideLogo" src="assets/nexgen-logo.png" alt="nexgen"></div>
  <nav class="main-nav" id="mainNav"></nav>
  <div class="sidebar-section"><div class="section-label">Catégories</div><div id="categoryNav"></div></div>
  <div class="sidebar-bottom"><span>Code</span><span>•</span><span>Play</span><span>•</span><span>Create</span></div>
</aside>
<main class="main">
<header class="hero" id="hero">
  <div class="hero-image"></div>
  <div class="hero-content">
    <img id="mainLogo" class="main-logo" src="assets/nexgen-logo.png" alt="nexgen">
    <div class="hero-tags" id="heroTags"></div>
  </div>
</header>
<section class="profile-strip">
  <div class="profile-main">
    <img id="avatar" class="avatar" src="" alt="Avatar GitHub">
    <div class="profile-copy">
      <div class="profile-name-row"><h1 id="displayName">nexgen</h1><a id="profileGithub" href="#" class="icon-button" aria-label="GitHub"><i class="fa-brands fa-github"></i></a></div>
      <p id="bio"></p><div class="stats" id="stats"></div>
    </div>
  </div>
  <div class="social-block"><div class="section-label">Retrouvez-moi sur</div><div class="socials" id="socials"></div></div>
</section>
<section class="global-tools">
  <div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input id="searchInput" placeholder="Rechercher un projet, une technologie, un tag..."><button id="clearSearch" title="Effacer"><i class="fa-solid fa-xmark"></i></button></div>
  <div class="tool-actions">
    <button class="tool-btn" id="themeBtn"><i class="fa-solid fa-palette"></i><span>Thème</span></button>
    <button class="tool-btn" id="importBtn"><i class="fa-brands fa-github"></i><span>Importer GitHub</span></button>
  </div>
</section>
<div id="tagBar" class="tag-bar"></div>
<div class="toolbar">
  <div><div class="eyebrow" id="pageEyebrow">PORTFOLIO</div><h2 id="pageTitle">Mes projets</h2></div>
  <div class="view-controls">
    <button class="view-btn active" data-view-mode="cards" title="Vue cartes"><i class="fa-solid fa-table-cells-large"></i></button>
    <button class="view-btn" data-view-mode="compact" title="Vue compacte"><i class="fa-solid fa-table-cells"></i></button>
    <button class="view-btn" data-view-mode="list" title="Vue liste"><i class="fa-solid fa-list"></i></button>
    <button class="view-btn" data-view-mode="masonry" title="Vue masonry"><i class="fa-solid fa-grip"></i></button>
  </div>
</div>
<div id="content"></div>
<footer id="footer"></footer>
</main></div>
<div class="mobile-bar"><button id="mobileMenu"><i class="fa-solid fa-bars"></i></button><span id="mobileTitle">nexgen</span></div>

<div id="themePanel" class="drawer">
  <div class="drawer-head"><h3>Thèmes</h3><button class="close-drawer">×</button></div><div id="themeChoices"></div>
</div>

<div id="importPanel" class="drawer wide">
  <div class="drawer-head"><h3>Importer les dépôts GitHub</h3><button class="close-drawer">×</button></div>
  <p class="drawer-note">L'import lit l'API publique GitHub dans le navigateur. Les dépôts récupérés peuvent être contrôlés puis exportés en JSON.</p>
  <div class="import-controls"><input id="importUsername" placeholder="Nom GitHub"><button id="runImport" class="primary-btn">Charger</button></div>
  <div id="importStatus"></div><div id="importResults"></div>
  <button id="exportImported" class="primary-btn" disabled>Exporter projects.json</button>
</div>

<div id="detailModal" class="modal">
  <div class="modal-card"><button class="modal-close">×</button><div id="detailContent"></div></div>
</div>

<div id="galleryModal" class="modal gallery-modal">
  <div class="gallery-card"><button class="modal-close gallery-close">×</button><button class="gallery-nav prev"><i class="fa-solid fa-chevron-left"></i></button><img id="galleryImage" src="" alt=""><button class="gallery-nav next"><i class="fa-solid fa-chevron-right"></i></button><div id="galleryCaption"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="web/js/app.js"></script>
</body></html>
